  <style>
:root {
  --pink: #ff2bd6;
  --yellow: #ffe500;
  --cyan: #3dfff2;
  --orange: #ff4d1c;
  --ink: #0b0b0d;
  --paper: #f6f3ea;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--ink);
  color: var(--paper);
  font-family: "Archivo Narrow", "Arial Narrow", Impact, sans-serif;
  overflow: hidden;
}

button, a { font: inherit; }

#stage {
  position: fixed;
  inset: 0;
  background: #000;
  overflow: hidden;
}

#yt-mount {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #000;
}

#yt-mount iframe {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 100vw;
  height: 100vh;
  min-width: 177.78vh;
  min-height: 56.25vw;
  transform: translate(-50%, -50%);
  border: 0;
  pointer-events: none;
}

.scan {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0.035) 0 1px,
    transparent 1px 3px
  );
  mix-blend-mode: overlay;
}

.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.55) 100%);
}

.bug {
  position: absolute;
  z-index: 6;
  top: calc(14px + var(--safe-t));
  right: calc(14px + var(--safe-r));
  background: var(--yellow);
  color: #111;
  font-family: Anton, Impact, sans-serif;
  font-size: clamp(26px, 4vw, 40px);
  line-height: 0.85;
  letter-spacing: -0.5px;
  padding: 7px 10px 5px;
  transform: rotate(8deg);
  box-shadow: 5px 5px 0 var(--pink);
  animation: wiggle 3.6s steps(2, end) infinite;
}

.bug small {
  display: block;
  font-family: "Archivo Narrow", sans-serif;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.18em;
}

@keyframes wiggle {
  0%, 80%, 100% { transform: rotate(8deg); }
  88% { transform: rotate(5deg) translate(-1px, 1px); }
  94% { transform: rotate(11deg); }
}

.nownext {
  position: absolute;
  z-index: 6;
  top: calc(14px + var(--safe-t));
  left: calc(14px + var(--safe-l));
  max-width: min(460px, calc(100vw - 120px));
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.pill {
  display: flex;
  align-items: baseline;
  gap: 8px;
  background: rgba(8, 8, 10, 0.78);
  border: 2px solid var(--cyan);
  padding: 4px 8px 3px;
  box-shadow: 3px 3px 0 rgba(61, 255, 242, 0.35);
  backdrop-filter: blur(4px);
}

.pill b {
  font-family: Anton, Impact, sans-serif;
  letter-spacing: 0.06em;
  font-size: 13px;
  color: var(--yellow);
  flex: none;
}

.pill span {
  font-weight: 700;
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pill.next {
  border-color: var(--pink);
  box-shadow: 3px 3px 0 rgba(255, 43, 214, 0.35);
  opacity: 0.92;
}

.pill.next b { color: var(--pink); }

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff2a2a;
  box-shadow: 0 0 0 0 rgba(255, 42, 42, 0.7);
  animation: pulse 1.4s infinite;
  flex: none;
  align-self: center;
}

@keyframes pulse {
  70% { box-shadow: 0 0 0 7px rgba(255, 42, 42, 0); }
}

#radio {
  position: absolute;
  z-index: 7;
  top: calc(92px + var(--safe-t));
  left: calc(14px + var(--safe-l));
  appearance: none;
  border: 0;
  cursor: pointer;
  background: var(--pink);
  color: #140010;
  font-family: Anton, Impact, sans-serif;
  letter-spacing: 0.08em;
  font-size: 18px;
  padding: 8px 14px 6px;
  box-shadow: 4px 4px 0 var(--yellow);
  min-height: 44px;
  min-width: 44px;
}

#radio[aria-pressed="true"] {
  background: var(--cyan);
  box-shadow: 4px 4px 0 var(--orange);
}

#radio:focus-visible, #ligar:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}

.xcard {
  position: absolute;
  z-index: 6;
  right: calc(14px + var(--safe-r));
  bottom: calc(108px + var(--safe-b));
  width: min(340px, calc(100vw - 28px));
  background: rgba(7, 7, 9, 0.88);
  color: white;
  border: 2px solid var(--paper);
  box-shadow: 6px 6px 0 var(--cyan);
  padding: 10px 12px 12px;
  animation: cardin 0.35s ease;
}

@keyframes cardin {
  from { transform: translateY(10px); opacity: 0; }
  to { transform: none; opacity: 1; }
}

.xhead {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 6px;
}

.xmark {
  width: 28px;
  height: 28px;
  background: #fff;
  color: #000;
  font-family: Anton, Impact, sans-serif;
  display: grid;
  place-items: center;
  font-size: 16px;
  flex: none;
}

.xwho { min-width: 0; }
.xwho strong { display: block; font-size: 15px; line-height: 1.1; }
.xwho em {
  font-style: normal;
  color: var(--cyan);
  font-size: 13px;
}

.xtext {
  margin: 0;
  font-size: 15px;
  line-height: 1.25;
  font-weight: 600;
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
  overflow: hidden;
  white-space: pre-wrap;
}

.xmeta {
  margin-top: 6px;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--yellow);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lower {
  position: absolute;
  z-index: 6;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  align-items: stretch;
  min-height: 72px;
  padding-bottom: var(--safe-b);
  background: linear-gradient(90deg, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.55));
}

.block-name {
  flex: none;
  background: var(--yellow);
  color: #111;
  font-family: Anton, Impact, sans-serif;
  font-size: clamp(18px, 3vw, 28px);
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  padding: 0 16px;
  clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
  padding-right: 28px;
}

.ticker-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  padding: 0 16px 0 8px;
  background: linear-gradient(90deg, var(--pink), #7a12ff 70%, transparent);
}

.ticker {
  font-weight: 700;
  font-size: clamp(16px, 2.4vw, 22px);
  line-height: 1.2;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.tag-trecho {
  flex: none;
  align-self: center;
  margin-right: 12px;
  border: 2px solid var(--yellow);
  color: var(--yellow);
  font-family: Anton, Impact, sans-serif;
  font-size: 12px;
  letter-spacing: 0.12em;
  padding: 3px 6px 1px;
}

body.is-bumper .lower,
body.is-bumper .xcard,
body.is-bumper .nownext {
  opacity: 0 !important;
  animation: none !important;
  pointer-events: none;
}

#x-embed iframe {
  width: 100% !important;
  max-height: 200px;
}

#bumper {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  background: #07060c;
  overflow: hidden;
}

#bumper[hidden], #radio-stage[hidden], #splash[hidden], .xcard[hidden], #radio[hidden] {
  display: none !important;
}

.bump-word {
  font-family: Anton, Impact, sans-serif;
  font-size: clamp(64px, 16vw, 180px);
  letter-spacing: -0.04em;
  line-height: 0.8;
  color: var(--yellow);
  animation: glitch 0.35s steps(2, end) infinite;
  text-align: center;
  padding: 0 12px;
}

.bump-sub {
  position: absolute;
  bottom: 12%;
  font-family: Anton, Impact, sans-serif;
  letter-spacing: 0.28em;
  color: var(--cyan);
  font-size: clamp(14px, 2vw, 22px);
}

#bumper::before,
#bumper::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 18%;
  background: var(--pink);
  mix-blend-mode: multiply;
  animation: bars 0.45s steps(2, end) infinite;
}

#bumper::before { top: 8%; }
#bumper::after { bottom: 10%; animation-direction: reverse; background: var(--cyan); }

@keyframes glitch {
  0% { transform: translate(0, 0); text-shadow: 4px 0 var(--pink), -4px 0 var(--cyan); }
  40% { transform: translate(-6px, 2px) skewX(-6deg); text-shadow: -6px 0 var(--cyan), 6px 0 var(--orange); }
  70% { transform: translate(5px, -3px); color: var(--paper); }
  100% { transform: none; }
}

@keyframes bars {
  0% { transform: translateX(0); }
  50% { transform: translateX(-4%) scaleY(1.4); }
  100% { transform: translateX(3%); }
}

#radio-stage {
  position: absolute;
  inset: 0;
  z-index: 3;
  background:
    radial-gradient(circle at 20% 20%, rgba(255, 43, 214, 0.4), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(61, 255, 242, 0.25), transparent 42%),
    #09090d;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
}

.eq {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 120px;
}

.eq i {
  display: block;
  width: clamp(10px, 2vw, 16px);
  background: linear-gradient(var(--yellow), var(--pink));
  height: 20%;
  animation: eq 0.8s ease-in-out infinite alternate;
}

.eq i:nth-child(odd) { animation-duration: 0.55s; background: linear-gradient(var(--cyan), var(--pink)); }
.eq i:nth-child(3n) { animation-duration: 0.95s; }

@keyframes eq {
  from { height: 18%; }
  to { height: 100%; }
}

.station {
  font-family: Anton, Impact, sans-serif;
  font-size: clamp(36px, 8vw, 84px);
  letter-spacing: -0.03em;
  text-align: center;
  line-height: 0.9;
  text-shadow: 4px 4px 0 var(--pink);
}

.station small {
  display: block;
  margin-top: 8px;
  font-family: "Archivo Narrow", sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.22em;
  text-shadow: none;
  color: var(--cyan);
}

#splash {
  position: absolute;
  inset: 0;
  z-index: 8;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 14px;
  padding: 24px;
  text-align: center;
  background:
    linear-gradient(120deg, rgba(255, 43, 214, 0.25), transparent 40%),
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(0, 0, 0, 0.25) 3px 4px),
    #07060a;
}

.logo-big {
  font-family: Anton, Impact, sans-serif;
  font-size: clamp(88px, 22vw, 200px);
  line-height: 0.8;
  color: var(--yellow);
  text-shadow: 8px 8px 0 var(--pink), -4px 0 var(--cyan);
  animation: glitch 0.7s steps(2, end) infinite;
}

#splash p {
  margin: 0;
  max-width: 34ch;
  font-size: 18px;
  font-weight: 700;
}

#ligar {
  appearance: none;
  border: 0;
  cursor: pointer;
  background: var(--yellow);
  color: #111;
  font-family: Anton, Impact, sans-serif;
  font-size: clamp(28px, 6vw, 44px);
  letter-spacing: 0.04em;
  padding: 12px 28px 8px;
  box-shadow: 8px 8px 0 var(--pink);
  min-height: 64px;
}

#ligar:hover { transform: translate(-2px, -2px); }

.hint {
  color: var(--cyan);
  font-size: 14px !important;
  letter-spacing: 0.04em;
}

body.is-radio #yt-mount { visibility: hidden; }
body.is-spot #radio-stage { visibility: hidden; }

@media (max-width: 720px) {
  .nownext { max-width: calc(100vw - 96px); }
  .pill span { font-size: 13px; }
  .xcard {
    left: calc(10px + var(--safe-l));
    right: calc(10px + var(--safe-r));
    width: auto;
    bottom: calc(112px + var(--safe-b));
  }
  .xtext { -webkit-line-clamp: 3; font-size: 14px; }
  .lower { min-height: 64px; }
  .block-name { font-size: 16px; padding: 0 10px; }
  #radio { top: calc(108px + var(--safe-t)); }
  .tag-trecho { display: none; }
  .bump-sub { bottom: 18%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
  }
}

</style>
</head>

          fs: 0,
          modestbranding: 1,
          rel: 0,
          playsinline: 1,
          start: span.start,
          end: span.end,
          iv_load_policy: 3,
          cc_load_policy: 0
        };
        if (location.protocol !== "file:") playerVars.origin = location.origin;
        try {
        player = new YT.Player(holder, {
          videoId: entry.item.id,
          host: "https://www.youtube-nocookie.com",
          playerVars: playerVars,
          events: {
            onReady: function (ev) {
              try {
                ev.target.mute();
                ev.target.playVideo();
              } catch (err) { /* watchdog assume */ }
            },
            onStateChange: function (ev) {
              if (ev.data === YT.PlayerState.PLAYING && !playing) {
                playing = true;
                if (soundOn) {
                  try {
                    ev.target.unMute();
                    ev.target.setVolume(90);
                  } catch (err) { /* segue mudo se o navegador barrar */ }
                }
                clearTimeout(watch);
                var left = (span.end - span.start) * 1000 + 4000;
                watch = setTimeout(function () { finish("cut"); }, left);
                var waited = Date.now() - opened;
                var rest = Math.max(0, bumperMs - waited);
                setTimeout(function () {
                  if (!finished) hideBumper();
                }, rest);
              }
              if (ev.data === YT.PlayerState.ENDED) finish("ended");
            },
            onError: function (ev) { finish("error:" + (ev && ev.data)); }
          }
        });
        } catch (err) {
          finish("error");
        }
      });
    });
  }

  async function startTV(my) {
    mode = "tv";
    document.body.classList.remove("is-radio", "is-spot");
    $("radio-stage").hidden = true;
    $("radio").textContent = "RÁDIO";
    $("radio").setAttribute("aria-pressed", "false");
    radioPlaying = false;
    stopAudio();
    var guard = 0;
    while (session === my && mode === "tv" && guard < 400) {
      guard += 1;
      var entry = schedule[index % schedule.length];
      var nextEntry = schedule[(index + 1) % schedule.length];
      renderChrome(entry, nextEntry);
      var before = index;
      try {
        await playVideo(entry, my);
      } catch (err) {
        pushLog("end", entry, "throw");
        destroyPlayer();
        hideBumper();
      }
      if (session !== my || mode !== "tv") return;
      index = before + 1;
      if (index >= schedule.length) {
        completedLoop = true;
        index = 0;
      }
    }
  }

  function stopAudio() {
    radioPlaying = false;
    try {
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
    } catch (err) { /* sem stream */ }
  }

  function waitForTime(el, ms) {
    return new Promise(function (resolve) {
      var timer = setTimeout(function () { resolve(false); }, ms);
      var tick = setInterval(function () {
        if (el.currentTime > 0.25) {
          clearTimeout(timer);
          clearInterval(tick);
          resolve(true);
        }
      }, 200);
    });
  }

  async function openStream(my) {
    var list = catalog.radio.streams;
    for (var i = 0; i < list.length; i += 1) {
      if (session !== my) return null;
      var stream = list[i];
      activeStream = stream;
      audio.src = stream.src;
      try {
        await audio.play();
      } catch (err) {
        pushLog("radio-reject", null, stream.id);
        continue;
      }
      var ok = await waitForTime(audio, 7000);
      if (session !== my) return null;
      if (ok) {
        radioPlaying = true;
        pushLog("radio-on", null, stream.id);
        return stream;
      }
      stopAudio();
    }
    radioPlaying = false;
    return null;
  }

  function paintStation(stream) {
    $("station-name").textContent = stream ? stream.name : "SEM SINAL";
    $("station-tag").textContent = stream ? stream.tag : "tentando de novo na TV";
  }

  async function startRadio(my) {
    mode = "radio";
    document.body.classList.add("is-radio");
    document.body.classList.remove("is-spot");
    $("radio-stage").hidden = false;
    $("radio").textContent = "TV";
    $("radio").setAttribute("aria-pressed", "true");
    destroyPlayer();
    hideBumper();
    var fake = {
      block: { name: "NO AR", summary: catalog.radio.name },
      item: {
        title: catalog.radio.name,
        artist: "sintonizando",
        lines: catalog.radio.lines,
        kind: "radio"
      },
      posts: catalog.blocks[1].posts
    };
    renderChrome(fake, schedule[index % schedule.length]);
    $("now").textContent = "Rádio pop — ao vivo";
    paintStation(null);
    var stream = await openStream(my);
    if (session !== my) return;
    if (!stream) {
      $("ticker").textContent = "Sem sinal nas duas emissoras. A TV volta.";
      await sleep(1600);
      if (session !== my) return;
      session += 1;
      mode = "tv";
      startTV(session);
      return;
    }
    paintStation(stream);
    $("now").textContent = stream.name + " — " + stream.tag;
    var spotAt = 0;
    var seg = TEST ? catalog.radio.testSegmentMs : catalog.radio.segmentMs;
    while (session === my && mode === "radio") {
      var alive = await sleepOrBust(seg, my);
      if (!alive) return;
      var spot = catalog.radio.spots[spotAt % catalog.radio.spots.length];
      spotAt += 1;
      var entry = {
        block: { name: "INTERVALO DO RÁDIO", summary: "spot" },
        item: spot,
        posts: []
      };
      try { audio.pause(); } catch (err) { /* segue o spot */ }
      radioPlaying = false;
      document.body.classList.add("is-spot");
      renderChrome(entry, fake);
      pushLog("radio-spot", entry);
      await playVideo(entry, my);
      if (session !== my || mode !== "radio") return;
      document.body.classList.remove("is-spot");
      $("radio-stage").hidden = false;
      renderChrome(fake, schedule[index % schedule.length]);
      $("now").textContent = stream.name + " — " + stream.tag;
      paintStation(stream);
      try {
        await audio.play();
        radioPlaying = true;
      } catch (err) {
        var again = await openStream(my);
        if (!again) break;
        stream = again;
      }
    }
  }

  function sleepOrBust(ms, my) {
    return new Promise(function (resolve) {
      var start = Date.now();
      var timer = setInterval(function () {
        if (session !== my || mode !== "radio") {
          clearInterval(timer);
          resolve(false);
        } else if (Date.now() - start >= ms) {
          clearInterval(timer);
          resolve(true);
        }
      }, 200);
    });
  }

  function powerOn() {
    if (powered) return;
    powered = true;
    unlockAudio();
    $("splash").hidden = true;
    $("radio").hidden = false;
    loadTwitter();
    session += 1;
    pushLog("on", null, "ligar");
    startTV(session);
  }

  function toggleRadio() {
    if (!powered) return;
    session += 1;
    if (mode === "radio") {
      pushLog("radio-off", null, "");
      startTV(session);
    } else {
      pushLog("radio-ask", null, "");
      startRadio(session);
    }
  }

  $("ligar").addEventListener("click", powerOn);
  $("radio").addEventListener("click", toggleRadio);

  document.addEventListener("visibilitychange", function () {
    if (document.hidden || !powered) return;
    if (mode === "radio" && audio.src) {
      audio.play().catch(function () {});
    }
  });

  loadApi();

  window.__TV = {
    get log() { return log.slice(); },
    get completedLoop() { return completedLoop; },
    get mode() { return mode; },
    get radioPlaying() { return radioPlaying; },
    get schedule() { return schedule; },
    get index() { return index; },
    catalog: catalog
  };
})();

</script>
</body>
</html>
